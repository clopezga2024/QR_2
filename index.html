<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#121212">
<title>Recuerdo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#1c1c1c,#2f2f2f);
    color:white;min-height:100vh;display:flex;
    justify-content:center;align-items:center;padding:20px
}
.card{
    max-width:420px;width:100%;background:#121212;
    border-radius:20px;overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.4)
}
.cover{display:block;width:100%;max-height:520px;object-fit:cover}
.content{padding:25px;text-align:center}
h1{font-size:28px;margin-bottom:10px}
p{color:#ccc;margin-bottom:20px;line-height:1.5;white-space:pre-line}
.audio-title{font-size:15px;margin-bottom:10px}
audio{width:100%}
.heart{font-size:40px;margin-bottom:15px}
.loading,.error{text-align:center;font-size:20px;padding:30px}
.error small{display:block;margin-top:12px;color:#aaa;font-size:13px}
</style>
</head>
<body>

<div id="app" class="loading">Cargando recuerdo...</div>

<script>
async function cargarCliente(){
    const params=new URLSearchParams(window.location.search);
    const id=params.get('id');

    if(!id){
        document.getElementById('app').innerHTML=
        '<div class="error"><h2>Recuerdo no encontrado</h2><small>Falta el identificador.</small></div>';
        return;
    }

    const base=`clientes/${encodeURIComponent(id)}/`;

    try{
        const response=await fetch(`${base}data.json`,{cache:'no-store'});
        if(!response.ok) throw new Error('No se encontró data.json');

        const data=await response.json();

        const nombre=data.nombre||'Un recuerdo especial';
        const mensaje=data.mensaje||'';
        const foto=data.foto||'';
        const audio=data.audio||'';

        document.title=nombre;

        const fotoHTML=foto
            ? `<img class="cover" src="${base}${encodeURIComponent(foto)}" alt="${escapeHTML(nombre)}">`
            : '';

        const audioHTML=audio
            ? `<div class="audio-title">🎵 Escucha este recuerdo</div>
               <audio controls preload="metadata">
                 <source src="${base}${encodeURIComponent(audio)}" type="audio/mpeg">
                 Tu navegador no puede reproducir este audio.
               </audio>`
            : '';

        document.getElementById('app').className='';
        document.getElementById('app').innerHTML=`
            <div class="card">
                ${fotoHTML}
                <div class="content">
                    <div class="heart">❤️</div>
                    <h1>${escapeHTML(nombre)}</h1>
                    <p>${escapeHTML(mensaje)}</p>
                    ${audioHTML}
                </div>
            </div>`;
    }catch(error){
        console.error(error);
        document.getElementById('app').innerHTML=
        `<div class="error"><h2>Error cargando el recuerdo</h2>
        <small>Verifica que exista clientes/${escapeHTML(id)}/data.json</small></div>`;
    }
}

function escapeHTML(text){
    return String(text)
      .replaceAll('&','&amp;').replaceAll('<','&lt;')
      .replaceAll('>','&gt;').replaceAll('"','&quot;')
      .replaceAll("'",'&#039;');
}

cargarCliente();
</script>
</body>
</html>
